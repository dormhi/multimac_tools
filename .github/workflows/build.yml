name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS 15, arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build MultiMac.app
        run: ./scripts/build.sh

      - name: Verify bundle
        run: |
          APP=build/app.noindex/MultiMac.app
          test -x "$APP/Contents/MacOS/MultiMac"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --verbose "$APP"
          file "$APP/Contents/MacOS/MultiMac"
